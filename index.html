<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EspressoLog">
<meta name="theme-color" content="#1a1410">
<title>EspressoLog</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;min-height:100dvh;background:linear-gradient(170deg,#1a1410 0%,#231c15 50%,#1a1410 100%);color:#ede4da;font-family:'Georgia','Hiragino Mincho ProN','Yu Mincho',serif;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(200,149,108,0.2);border-radius:2px}
input::placeholder,textarea::placeholder{color:rgba(200,149,108,0.3)}
select{color-scheme:dark}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:20px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#c8956c;border:3px solid #1a1410;box-shadow:0 2px 6px rgba(0,0,0,0.4)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#c8956c;border:3px solid #1a1410;box-shadow:0 2px 6px rgba(0,0,0,0.4)}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 100px;font-size:15px}
.header{text-align:center;margin-bottom:28px;padding:10px 0;position:relative}
.header h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.1em;font-weight:600;color:#c8956c;letter-spacing:3px;margin-bottom:4px}
.header p{font-size:0.73em;color:#6b5a4e;letter-spacing:2px}
.header-actions{position:absolute;top:10px;right:0;display:flex;gap:6px}
.hicon{background:none;border:1px solid rgba(200,149,108,0.2);border-radius:8px;padding:6px 10px;color:#8a7b6e;font-size:0.85em;cursor:pointer;font-family:inherit;transition:all 0.15s}
.hicon:hover{border-color:rgba(200,149,108,0.5);color:#ede4da}
.tabs{display:flex;margin-bottom:24px;background:rgba(255,255,255,0.04);border-radius:12px;padding:3px}
.tab{flex:1;padding:10px 0;border:none;border-radius:10px;background:transparent;color:#6b5a4e;font-size:0.93em;font-weight:400;cursor:pointer;transition:all 0.2s;font-family:inherit}
.tab.active{background:rgba(200,149,108,0.2);color:#ede4da;font-weight:600}
.form{display:flex;flex-direction:column;gap:18px;animation:fadeIn 0.3s ease}
.lbl{font-size:0.8em;color:#8a7b6e;letter-spacing:0.5px}
.slbl{font-size:0.73em;color:#6b5a4e;letter-spacing:0.5px}
.sel-wrap{position:relative}
.sel{width:100%;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,0.05);border:1px solid rgba(200,149,108,0.2);border-radius:10px;padding:10px 32px 10px 12px;color:#ede4da;font-size:1em;outline:none;cursor:pointer;font-family:inherit}
.sel:focus{border-color:rgba(200,149,108,0.4)}
.sel-arr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#8a7b6e;font-size:0.8em;pointer-events:none}
.inp{background:rgba(255,255,255,0.04);border:1px solid rgba(200,149,108,0.15);border-radius:8px;padding:8px 10px;color:#ede4da;font-size:0.93em;outline:none;font-family:inherit;width:100%}
.inp:focus{border-color:rgba(200,149,108,0.4)}
.chip{background:rgba(200,149,108,0.08);border:1px solid rgba(200,149,108,0.12);border-radius:8px;padding:6px 12px;color:#8a7b6e;font-size:0.87em;cursor:pointer;font-family:inherit;transition:background 0.15s,border-color 0.15s,color 0.15s}
.chip.on{background:rgba(200,149,108,0.3);border-color:rgba(200,149,108,0.5);color:#ede4da}
.btn-save{background:linear-gradient(135deg,#c8956c 0%,#a07050 100%);border:none;border-radius:12px;padding:14px 0;color:#1a1410;font-size:1.07em;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:inherit;width:100%}
.btn-toggle{background:none;border:1px solid rgba(200,149,108,0.15);border-radius:10px;padding:10px 14px;color:#8a7b6e;font-size:0.87em;cursor:pointer;text-align:left;font-family:inherit;width:100%}
.btn-add{background:none;border:1px dashed rgba(200,149,108,0.25);border-radius:10px;padding:8px 14px;color:#8a7b6e;font-size:0.87em;cursor:pointer;text-align:center;font-family:inherit;width:100%}
.btn-del{margin-top:10px;background:none;border:1px solid rgba(200,100,100,0.3);border-radius:8px;padding:6px 14px;color:#c87070;font-size:0.8em;cursor:pointer;font-family:inherit}
.card{background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 16px;border:1px solid rgba(200,149,108,0.1);cursor:pointer;transition:all 0.2s}
.ratio-box{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;background:rgba(200,149,108,0.08);border-radius:10px}
.ratio-val{font-size:1.2em;font-weight:700;color:#c8956c;font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:1px}
.taste-btn{flex:1;height:28px;border:none;border-radius:6px;cursor:pointer;transition:background 0.15s,color 0.15s;font-size:0.73em;font-family:inherit}
.empty{text-align:center;padding:60px 20px;color:#6b5a4e}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.photo-area{border:2px dashed rgba(200,149,108,0.2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;min-height:80px;display:flex;align-items:center;justify-content:center}
.photo-area:hover{border-color:rgba(200,149,108,0.4)}
.photo-area.has-photo{border-style:solid;padding:0;display:block}
.photo-area img{width:100%;border-radius:10px;display:block}
.photo-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,0.7);border-radius:50%;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sec-lbl{font-size:0.8em;color:#c8956c;font-weight:600;margin-top:4px;padding-bottom:4px;border-bottom:1px solid rgba(200,149,108,0.12)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="photo-input" accept="image/*" style="display:none">
<input type="file" id="import-input" accept=".json" style="display:none">
<script>
"use strict";

/* ══ STORAGE ══ */
const LS={get(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ══ INDEXEDDB (photos) ══ */
let pDB=null;
function openPDB(){return new Promise((res,rej)=>{const r=indexedDB.open("EspressoLogPhotos",1);r.onupgradeneeded=e=>e.target.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=e=>{pDB=e.target.result;res(pDB)};r.onerror=rej})}
async function gDB(){return pDB||await openPDB()}
async function svPhoto(id,data){const db=await gDB();return new Promise((res,rej)=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").put({id,data});tx.oncomplete=res;tx.onerror=rej})}
async function gtPhoto(id){const db=await gDB();return new Promise((res,rej)=>{const tx=db.transaction("photos","readonly");const r=tx.objectStore("photos").get(id);r.onsuccess=()=>res(r.result?.data||null);r.onerror=rej})}
async function dlPhoto(id){const db=await gDB();return new Promise(res=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").delete(id);tx.oncomplete=res})}
function compressPhoto(file){return new Promise(res=>{const fr=new FileReader();fr.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");let w=img.width,ht=img.height;if(w>800){ht=ht*800/w;w=800}c.width=w;c.height=ht;c.getContext("2d").drawImage(img,0,0,w,ht);res(c.toDataURL("image/jpeg",0.72))};img.src=e.target.result};fr.readAsDataURL(file)})}

/* ══ CONSTANTS ══ */
const FLAGS={"エチオピア":"🇪🇹","ケニア":"🇰🇪","コロンビア":"🇨🇴","ブラジル":"🇧🇷","グアテマラ":"🇬🇹","コスタリカ":"🇨🇷","パナマ":"🇵🇦","インドネシア":"🇮🇩","ルワンダ":"🇷🇼","タンザニア":"🇹🇿","ホンジュラス":"🇭🇳","ペルー":"🇵🇪","メキシコ":"🇲🇽","イエメン":"🇾🇪","ニカラグア":"🇳🇮","ボリビア":"🇧🇴","エルサルバドル":"🇸🇻","中国":"🇨🇳","インド":"🇮🇳","ベトナム":"🇻🇳"};
const PROCS=["Washed","Natural","Honey","Anaerobic","Carbonic Maceration","Wet Hulled","Other"];
const ROAST_LEVELS=["浅煎り","中煎り","中深煎り","深煎り"];
const GRINDERS_BUILTIN={"fellow_opus":{name:"Fellow Opus",min:1,max:11,step:0.25,dflt:5},"timemore_xlite":{name:"Timemore X Lite",min:3,max:24,step:0.5,dflt:14},"comandante_c40":{name:"Comandante C40",min:0,max:45,step:1,dflt:25},"1zpresso_jxpro":{name:"1Zpresso JX-Pro",min:0,max:40,step:1,dflt:15},"niche_zero":{name:"Niche Zero",min:0,max:50,step:1,dflt:15},"eureka_mignon":{name:"Eureka Mignon",min:0,max:18,step:0.5,dflt:5}};
function getG(){const c=LS.get("esplog_custom_grinders",[]);const o={...GRINDERS_BUILTIN};c.forEach(g=>{o["c_"+g.id]={name:g.name,min:g.min,max:g.max,step:g.step||1,dflt:Math.round((g.min+g.max)/2),custom:true,id:g.id}});o["other"]={name:"その他",min:1,max:40,step:1,dflt:15};return o}
const MACH_DEF=["Flair 58","Flair Pro 2","La Pavoni","Gaggia Classic Pro","Breville Barista Express","Rancilio Silvia","De'Longhi Dedica","Cafelat Robot","9Barista","Decent DE1"];
const TAMP_DEF=["Spring Tamper（定圧）","Manual","Normcore V4","Force Tamper"];
const MILK_T=["牛乳","低脂肪乳","オーツミルク","ソイミルク","アーモンドミルク","その他"];
const ART_T=["Heart","Rosetta","Tulip","Leaf","Swan","Free Pour","Layered","その他"];
const TASTE=[{k:"acidity",l:"酸味",e:"🍋"},{k:"sweetness",l:"甘味",e:"🍯"},{k:"bitterness",l:"苦味",e:"🫘"},{k:"body",l:"ボディ",e:"☕"},{k:"aftertaste",l:"後味",e:"✨"}];
const RADAR=[{k:"overall",l:"おいしさ"},...TASTE.map(t=>({k:t.k,l:t.l}))];
/* 選択肢リスト */
const DOSES=Array.from({length:17},(_,i)=>+(14+i*0.5).toFixed(1));     /* 14.0〜22.0g */
const YIELDS=Array.from({length:41},(_,i)=>20+i);                       /* 20〜60g */
const PRESSURES=Array.from({length:19},(_,i)=>+(3+i*0.5).toFixed(1));  /* 3.0〜12.0bar */
const TIMES=Array.from({length:36},(_,i)=>15+i);                        /* 15〜50秒 */
const TAMP_P=Array.from({length:21},(_,i)=>10+i);                       /* 10〜30kg */
const ESP_ML=Array.from({length:41},(_,i)=>20+i);                       /* 20〜60ml */
const MILK_ML=[50,60,70,80,90,100,110,120,130,140,150,160,170,180,200,220,240,260,280,300,350,400];

/* ══ HELPERS ══ */
function bName(b){const p=[];if(b.country)p.push(b.country);if(b.name?.trim()){p.push(b.name);return p.join(" / ")}if(b.farm)p.push(b.farm);if(b.process)p.push(`(${b.process})`);return p.length?p.join(" / "):"（名称未設定）"}
function bFlag(b){return FLAGS[b.country]||(b.country?"🌍":"")}
function h(tag,props,...ch){const el=document.createElement(tag);if(props)Object.entries(props).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(el.style,v);else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")el.className=v;else if(k==="innerHTML")el.innerHTML=v;else el.setAttribute(k,v)});ch.flat(9).forEach(c=>{if(c==null||c===false)return;el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c)});return el}
function mkSel(opts,val,onChange){const w=h("div",{className:"sel-wrap"});const s=h("select",{className:"sel"});opts.forEach(o=>{const op=h("option",{value:String(o)},String(o));if(String(o)===String(val))op.selected=true;s.appendChild(op)});s.addEventListener("change",e=>onChange(e.target.value));w.appendChild(s);w.appendChild(h("span",{className:"sel-arr"},"▼"));return w}
function fmtDate(iso){const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function radarSVG(data,size=180){const cx=size/2,cy=size/2,r=size/2-28,lv=5,n=RADAR.length,st=2*Math.PI/n,sa=-Math.PI/2;const pt=(i,v)=>{const a=sa+i*st,d=v/lv*r;return[cx+d*Math.cos(a),cy+d*Math.sin(a)]};let svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;for(let l=1;l<=lv;l++){const ps=Array.from({length:n},(_,i)=>pt(i,l));svg+=`<path d="${ps.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ')} Z" fill="none" stroke="rgba(200,149,108,0.12)" stroke-width="${l===lv?1:0.5}"/>`}for(let i=0;i<n;i++){const p=pt(i,lv);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(200,149,108,0.1)" stroke-width="0.5"/>`}const dp=RADAR.map((a,i)=>pt(i,data[a.k]||0));svg+=`<path d="${dp.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ')} Z" fill="rgba(200,149,108,0.2)" stroke="#c8956c" stroke-width="1.5"/>`;dp.forEach(p=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#c8956c"/>`});RADAR.forEach((a,i)=>{const an=sa+i*st,d=r+18;svg+=`<text x="${cx+d*Math.cos(an)}" y="${cy+d*Math.sin(an)}" text-anchor="middle" dominant-baseline="middle" style="font-size:10px;fill:#8a7b6e">${a.l}</text>`});return svg+`</svg>`}
function starsSVG(v){const r=Math.round(v*2)/2;const d="M10 1 L12.6 7.3 L19.5 7.8 L14.2 12.3 L15.8 19 L10 15.3 L4.2 19 L5.8 12.3 L0.5 7.8 L7.4 7.3 Z";let s="";for(let i=1;i<=5;i++){s+=r>=i?`<svg width="22" height="22" viewBox="0 0 20 20"><path d="${d}" fill="#c8956c"/></svg>`:r>=i-0.5?`<svg width="22" height="22" viewBox="0 0 20 20"><defs><linearGradient id="hg${i}"><stop offset="50%" stop-color="#c8956c"/><stop offset="50%" stop-color="rgba(200,149,108,0.2)"/></linearGradient></defs><path d="${d}" fill="url(#hg${i})"/></svg>`:`<svg width="22" height="22" viewBox="0 0 20 20"><path d="${d}" fill="rgba(200,149,108,0.2)"/></svg>`}return s}

/* ══ STATE ══ */
let state={view:"list",records:LS.get("esplog_records",[]),beans:LS.get("esplog_beans",[]),machines:LS.get("esplog_machines",MACH_DEF),tampers:LS.get("esplog_tampers",TAMP_DEF),fontSize:LS.get("esplog_fontsize","M"),brew:null,expandedCard:null,addingBean:false,showBeanList:false,viewingBean:null,editingBean:null,addingGrinder:false,addingMachine:false,addingTamper:false,photoData:null,_editSave:null};
const FS={S:{label:"小",base:13},M:{label:"中",base:15},L:{label:"大",base:17}};
function initBrew(){const G=getG();const gid=LS.get("esplog_last_grinder","fellow_opus");const gk=G[gid]?gid:"fellow_opus";return{beanId:"",grinderId:gk,machine:LS.get("esplog_last_machine",""),tamper:LS.get("esplog_last_tamper",""),grind:G[gk].dflt,tampPressure:15,dose:18,yield:36,pressure:9,timeSec:28,milkType:"牛乳",espressoMl:30,milkMl:180,artType:"",artOther:"",artScore:3,overall:3,acidity:0,sweetness:0,bitterness:0,body:0,aftertaste:0,note:""}}
state.brew=initBrew();
function save(){LS.set("esplog_records",state.records);LS.set("esplog_beans",state.beans);LS.set("esplog_machines",state.machines);LS.set("esplog_tampers",state.tampers)}

/* ══ ROOT RENDER ══ */
function render(){
  const app=document.getElementById("app");app.innerHTML="";
  const fs=FS[state.fontSize]||FS.M;app.style.fontSize=fs.base+"px";
  /* Header */
  const hdr=h("div",{className:"header"});
  hdr.appendChild(h("h1",null,"EspressoLog"));
  hdr.appendChild(h("p",null,"ESPRESSO & LATTE JOURNAL"));
  const szRow=h("div",{style:{display:"flex",justifyContent:"center",gap:4,marginTop:"8px"}});
  Object.keys(FS).forEach(k=>szRow.appendChild(h("button",{style:{background:state.fontSize===k?"rgba(200,149,108,0.25)":"rgba(200,149,108,0.08)",border:`1px solid ${state.fontSize===k?"rgba(200,149,108,0.4)":"rgba(200,149,108,0.1)"}`,borderRadius:6,padding:"3px 10px",color:state.fontSize===k?"#ede4da":"#6b5a4e",fontSize:"12px",cursor:"pointer",fontFamily:"inherit"},onClick:()=>{state.fontSize=k;LS.set("esplog_fontsize",k);render()}},FS[k].label)));
  hdr.appendChild(szRow);
  const ha=h("div",{className:"header-actions"});
  ha.appendChild(h("button",{className:"hicon",title:"エクスポート",onClick:async()=>{const data={records:state.records,beans:state.beans,machines:state.machines,tampers:state.tampers,photos:{}};for(const rec of state.records){if(rec.hasPhoto){const p=await gtPhoto(rec.id);if(p)data.photos[rec.id]=p}}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`espressolog_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}},"📤"));
  ha.appendChild(h("button",{className:"hicon",title:"インポート",onClick:()=>document.getElementById("import-input").click()},"📥"));
  hdr.appendChild(ha);app.appendChild(hdr);
  /* Tabs – 2つだけ */
  app.appendChild(h("div",{className:"tabs"},h("button",{className:"tab"+(state.view==="list"?" active":""),onClick:()=>{state.view="list";render()}},"履歴"),h("button",{className:"tab"+(state.view==="add"?" active":""),onClick:()=>{state.view="add";render()}},"＋ 記録する")));
  state.view==="add"?renderForm(app):renderList(app);
}

/* ══ GRIND SLIDER BLOCK ══ */
function buildGrindSlider(G,b){
  const g=G[b.grinderId]||G["fellow_opus"];
  const wrap=h("div",{id:"grind-area",style:{display:"flex",flexDirection:"column",gap:4}});
  wrap.appendChild(h("span",{className:"lbl"},`挽き目（${g.name}）`));
  const row=h("div",{style:{display:"flex",alignItems:"center",gap:12}});
  const dv=g.step<1?b.grind.toFixed(g.step===0.25?2:1):b.grind.toString();
  const numEl=h("span",{style:{fontSize:"22px",fontWeight:700,color:"#c8956c",minWidth:"48px",textAlign:"center",fontFamily:"'Cormorant Garamond',Georgia,serif"}},dv);
  row.appendChild(numEl);
  const slW=h("div",{style:{flex:1,position:"relative",padding:"8px 0"}});
  slW.appendChild(h("div",{style:{position:"absolute",top:"50%",left:0,right:0,height:"4px",background:"rgba(200,149,108,0.15)",borderRadius:"2px",transform:"translateY(-50%)"}}));
  const fill=h("div",{style:{position:"absolute",top:"50%",left:0,width:((b.grind-g.min)/(g.max-g.min)*100)+"%",height:"4px",background:"linear-gradient(90deg,#c8956c,#a07050)",borderRadius:"2px",transform:"translateY(-50%)"}});
  slW.appendChild(fill);
  slW.appendChild(h("input",{type:"range",min:g.min,max:g.max,step:g.step,value:b.grind,style:{width:"100%",position:"relative",zIndex:2},onInput:e=>{const v=parseFloat(e.target.value);b.grind=v;numEl.textContent=g.step<1?v.toFixed(g.step===0.25?2:1):v.toString();fill.style.width=((v-g.min)/(g.max-g.min)*100)+"%"}}));
  row.appendChild(slW);wrap.appendChild(row);
  wrap.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"10px",color:"#6b5a4e",padding:"0 4px"}},h("span",null,`細 ← ${g.min}`),h("span",null,`${g.max} → 粗`)));
  return wrap;
}

function updateRatios(){
  const b=state.brew;
  const el1=document.getElementById("brew-ratio-val");if(el1)el1.textContent=b.dose&&b.yield?`1 : ${(b.yield/b.dose).toFixed(2)}`:"—";
  const el2=document.getElementById("latte-ratio-val");if(el2)el2.textContent=b.espressoMl&&b.milkMl?`1 : ${(b.milkMl/b.espressoMl).toFixed(1)}`:"—";
}

/* ══ FORM ══ */
function renderForm(app){
  const G=getG();const b=state.brew;const isEdit=!!state._editSave;
  const form=h("div",{className:"form"});
